[project]
name = "ml-model"
version = "0.1.0"
description = "Microservice for handling EfficientNet-B0 classifications and Grad-CAM generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "asgiref==3.11.1",
    "attrs==26.1.0",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "click==8.4.1",
    "colorama==0.4.6",
    "et_xmlfile==2.0.0",
    "fastapi==0.136.3",
    "filelock==3.29.1",
    "fsspec==2026.4.0",
    "h11==0.16.0",
    "idna==3.11",
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.4.4",
    "opencv-python==4.13.0.92",
    "openpyxl==3.1.5",
    "outcome==1.3.0.post0",
    "pillow==12.2.0",
    "postgres==4.0",
    "psycopg2-binary==2.9.11",
    "psycopg2-pool==1.2",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic_core==2.46.4",
    "PyJWT==2.12.1",
    "PySocks==1.7.1",
    "python-multipart==0.0.31",
    "requests==2.33.1",
    "selenium==4.41.0",
    "setuptools==81.0.0",
    "sniffio==1.3.1",
    "sortedcontainers==2.4.0",
    "sqlparse==0.5.5",
    "starlette==1.2.1",
    "sympy==1.14.0",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "trio==0.33.0",
    "trio-websocket==0.12.2",
    "typing-inspection==0.4.2",
    "typing_extensions==4.15.0",
    "tzdata==2026.1",
    "urllib3==2.6.3",
    "uvicorn==0.49.0",
    "websocket-client==1.9.0",
    "wsproto==1.3.2",
]

[project.optional-dependencies]
dev = [
    "black>=23.3.0",
    "ruff>=0.0.270",
]

# --- Black Formatter Configuration ---
[tool.black]
line-length = 88
target-version = ['py311']
extend-exclude = '''
/(
    \.git
  | \.venv
  | lib64
  | pyvenv\.cfg
)/
'''

# --- Ruff Linter Configuration ---
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# Select rules: E (Error), F (Pyflakes/Logical Bugs), I (Isort/Import sorting)
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
