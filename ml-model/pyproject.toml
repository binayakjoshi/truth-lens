[project]
name = "truthlens-ml"
version = "0.1.0"
description = "Deepfake face detection model + inference service"
requires-python = ">=3.11,<3.13"

dependencies = [
    # API server
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "python-multipart==0.0.31",

    # ML / CV
    "torch==2.2.2",
    "torchvision==0.17.2",
    "facenet-pytorch==2.6.0",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "pillow==10.2.0",

    # utility
    "tqdm==4.68.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.0.270",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
