[project]
name = "ml-model"
version = "0.1.0"

dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.13.0",

    "fastapi==0.136.3",
    "starlette==0.47.3",
    "uvicorn==0.49.0",

    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "typing-extensions==4.15.0",

    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "pillow==10.2.0",

    "torch==2.2.2",
    "torchvision==0.17.2",
    "facenet-pytorch==2.6.0",

    "scikit-learn==1.2.2",
    "scipy==1.15.3",
    "joblib==1.5.3",
    "threadpoolctl==3.6.0",

    "pandas==2.0.3",

    "python-multipart==0.0.31",

    "psycopg2-binary==2.9.11",
    "psycopg2-pool==1.2",

    "PyJWT==2.12.1",

    "requests==2.34.2",
    "urllib3==2.7.0",
    "charset-normalizer==3.4.7",
    "certifi==2026.5.20",
    "idna==3.18",

    "tqdm==4.68.1",

    "python-dotenv==1.2.2",

    "filelock==3.29.1",
    "fsspec==2026.4.0",
    "networkx==3.6.1",
    "sympy==1.13.1",
    "jinja2==3.1.6",
    "MarkupSafe==3.0.3",

    "ruff>=0.0.270"
]

[project.optional-dependencies]
dev = []

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]