[project]
name = "truthlens-training"
version = "0.1.0"
description = "TruthLens local training and dataset preparation (venv only)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "truthlens-preprocessing",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "facenet-pytorch==2.6.0",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "pillow==10.2.0",
    "tqdm==4.68.1",
    "scikit-learn>=1.4.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.uv.sources]
truthlens-preprocessing = { path = "../preprocessing", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.0.270",
    "pytest>=8.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
