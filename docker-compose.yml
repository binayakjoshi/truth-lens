services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: frontend
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    command: npm run dev
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: development
    container_name: backend
    volumes:
      - ./backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    command: npm run start:dev

  ml-model:
    build:
      context: ./ml-model
      target: development
    container_name: ml-model
    volumes:
      - ./ml-model:/app
      - ml_venv:/app/.venv
    ports:
      - "8000:8000"
    command: uv run uvicorn truthlens.api.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15-alpine
    container_name: db
    env_file:
      - ./backend/.env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  frontend_node_modules:
  backend_node_modules:
  ml_venv:
