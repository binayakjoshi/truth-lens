services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: frontend
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    command: npm run dev
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: development
    container_name: backend
    volumes:
      - ./backend:/usr/src/app
      - backend_node_modules:/usr/src/app/node_modules
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: npm run start:dev

  ml-model:
    build:
      context: ./ml-model/inference
      additional_contexts:
        preprocessing: ./ml-model/preprocessing
      dockerfile: Dockerfile
      target: development
    container_name: ml-model
    volumes:
      # Mount only source so the image .venv is not overwritten (no venv volume)
      - ./ml-model/inference/src:/usr/src/app/src
      - ./ml-model/preprocessing/src:/usr/src/preprocessing/src
      - ./ml-model/inference/models:/usr/src/app/models
    ports:
      - "8000:8000"
    environment:
      # Docker Desktop on Windows often misses inotify events on bind mounts
      WATCHFILES_FORCE_POLLING: "true"
    command: uv run uvicorn truthlens.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /usr/src/app/src --reload-dir /usr/src/preprocessing/src

  db:
    image: postgres:15-alpine
    container_name: db
    env_file:
      - ./backend/.env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  db_data:
  redis_data:
  frontend_node_modules:
  backend_node_modules:
